name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
  pull-requests: read  # gitleaks が PR のコミット一覧を読むために必要
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [gas-inquiry-automation, gas-invoice-automation, excel-csv-aggregator, gas-csv-aggregator]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
